<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc3a0"/>
      <stop offset="50%" stop-color="#ffafbd"/>
      <stop offset="100%" stop-color="#ffc3a0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg2)"/>
  
  <!-- Flower bouquet & Heart -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="140" fill="#ffffff" fill-opacity="0.3"/>
    <!-- Rose petal shapes -->
    <path d="M 0 -40 C -40 -80 -80 -20 0 50 C 80 -20 40 -80 0 -40 Z" fill="#e63946"/>
    <path d="M -30 -10 C -60 -40 -70 10 -10 40 C 10 20 -10 -10 -30 -10 Z" fill="#ff4d6d"/>
    <path d="M 30 -10 C 60 -40 70 10 10 40 C -10 20 10 -10 30 -10 Z" fill="#ff758f"/>
    <path d="M 0 50 L 0 140" stroke="#588157" stroke-width="8" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 0 90 Q -40 70 -30 110 Q -10 100 0 90" fill="#588157"/>
    <path d="M 0 110 Q 40 90 30 130 Q 10 120 0 110" fill="#588157"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <circle cx="120" cy="200" r="5"/>
    <circle cx="480" cy="180" r="6"/>
    <circle cx="180" cy="420" r="4"/>
    <circle cx="440" cy="400" r="5"/>
  </g>

  <!-- Typography overlay placeholder -->
  <rect x="60" y="580" width="480" height="70" rx="16" fill="#ffffff" fill-opacity="0.85"/>
  <text x="300" y="612" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#e63946" text-anchor="middle">🌹 Favorite Moment 🌹</text>
  <text x="300" y="635" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#666" text-anchor="middle">Klik / ganti dengan foto kenangan favoritmu</text>
</svg>
