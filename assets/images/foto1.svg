<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="50%" stop-color="#fecfef"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc3a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="700" fill="url(#bg1)"/>
  <circle cx="300" cy="280" r="180" fill="url(#sun)" />
  
  <!-- Cloud & ambient shapes -->
  <path d="M 50 480 Q 150 420 280 470 T 550 450 L 600 700 L 0 700 Z" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M 0 540 Q 180 500 320 550 T 600 520 L 600 700 L 0 700 Z" fill="#ffffff" fill-opacity="0.5"/>
  
  <!-- Romantic couple silhouette & hearts -->
  <g transform="translate(300, 270) scale(1.3)">
    <path d="M 0 -20 A 30 30 0 0 0 -50 20 Q 0 80 0 100 Q 0 80 50 20 A 30 30 0 0 0 0 -20 Z" fill="#ff4d6d" filter="url(#glow)"/>
    <path d="M 0 -20 A 30 30 0 0 0 -50 20 Q 0 80 0 100 Q 0 80 50 20 A 30 30 0 0 0 0 -20 Z" fill="#ff758f"/>
  </g>
  
  <!-- Sparkles -->
  <g fill="#ffffff">
    <circle cx="150" cy="180" r="4"/>
    <circle cx="450" cy="160" r="5"/>
    <circle cx="200" cy="380" r="3"/>
    <circle cx="420" cy="360" r="4"/>
    <path d="M 160 120 Q 170 120 170 110 Q 170 120 180 120 Q 170 120 170 130 Q 170 120 160 120 Z" fill="#fff"/>
    <path d="M 440 240 Q 450 240 450 230 Q 450 240 460 240 Q 450 240 450 250 Q 450 240 440 240 Z" fill="#fff"/>
  </g>

  <!-- Typography overlay placeholder -->
  <rect x="60" y="580" width="480" height="70" rx="16" fill="#ffffff" fill-opacity="0.85"/>
  <text x="300" y="612" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#e63946" text-anchor="middle">✨ First Memory ✨</text>
  <text x="300" y="635" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#666" text-anchor="middle">Klik / ganti dengan foto Lana &amp; Kiki</text>
</svg>
